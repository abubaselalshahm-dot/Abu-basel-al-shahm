<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abu Basel Al Shahm</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abu Basel Al Shahm">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');

  :root{
    --bg:#121A1E;
    --surface:#1A2328;
    --surface-2:#212C31;
    --ink:#ECE8DF;
    --ink-dim:#93A2A6;
    --accent:#CB9152;
    --accent-ink:#1A1206;
    --mtn:#FFCC00;
    --syr:#E4032E;
    --debt:#E38455;
    --credit:#74BB8E;
    --border:rgba(236,232,223,0.09);
    --danger:#D5654E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Tajawal', sans-serif; margin:0; }
  .app{
    max-width:520px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; background:var(--bg); position:relative;
  }
  .header{
    padding:22px 20px 0;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border-bottom:1px solid var(--border);
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ font-size:19px; font-weight:800; letter-spacing:0.2px; }
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    width:38px;height:38px; border-radius:10px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:17px;
    transition:background .15s;
  }
  .icon-btn:hover{background:#28343A;}
  .currency-toggle{
    background:var(--surface-2); border:1px solid var(--border); color:var(--accent);
    border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .currency-toggle:active{transform:scale(0.96);}
  .stat-label{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
  .stat-value{
    font-size:34px; font-weight:800; font-family:'Tajawal',sans-serif;
    display:flex; align-items:baseline; gap:6px;
  }
  .stat-value .unit{ font-size:14px; font-weight:500; color:var(--ink-dim); }
  .stat-value.owed{color:var(--debt);}
  .stat-value.clear{color:var(--credit);}

  .tabs{ display:flex; gap:4px; margin-top:18px; }
  .tab{
    flex:1; text-align:center; padding:11px 8px; font-size:13.5px; font-weight:700;
    color:var(--ink-dim); border-bottom:2px solid transparent; cursor:pointer;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

  .toolbar{ display:flex; gap:10px; padding:16px 20px; }
  .search{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:11px 14px; color:var(--ink); font-family:inherit; font-size:14px;
  }
  .search::placeholder{color:var(--ink-dim);}
  .btn{
    font-family:inherit; font-weight:600; font-size:14px; border:none; border-radius:10px;
    padding:11px 18px; cursor:pointer; transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{opacity:0.92;}
  .btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
  .btn-danger{background:rgba(213,101,78,0.16); color:var(--danger); border:1px solid rgba(213,101,78,0.4);}

  .list{ padding:0 20px 100px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .empty{ text-align:center; color:var(--ink-dim); padding:60px 20px; font-size:14px; line-height:1.9; }

  .customer-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:15px 16px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .customer-card:hover{border-color:rgba(203,145,82,0.4); background:var(--surface-2);}
  .customer-info{display:flex; flex-direction:column; gap:7px; min-width:0;}
  .customer-name{font-weight:700; font-size:15.5px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap; }
  .chip-mtn{background:rgba(255,204,0,0.15); color:var(--mtn);}
  .chip-syr{background:rgba(228,3,46,0.15); color:#F0705F;}
  .chip-fmtn{background:transparent; color:var(--mtn); border:1px solid rgba(255,204,0,0.5);}
  .chip-fsyr{background:transparent; color:#F0705F; border:1px solid rgba(228,3,46,0.5);}
  .chip-cash{background:rgba(203,145,82,0.15); color:var(--accent);}
  .chip-usd{background:rgba(116,187,142,0.15); color:var(--credit);}
  .chip-manual{background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--border);}
  .customer-balance{
    font-weight:800; font-size:16px; font-family:'Tajawal',sans-serif;
    text-align:left; white-space:nowrap; padding-inline-start:10px;
  }
  .customer-balance.owed{color:var(--debt);}
  .customer-balance.clear{color:var(--credit);}
  .customer-balance .sub{
    display:block; font-size:10px; font-weight:500; color:var(--ink-dim);
    font-family:'IBM Plex Sans Arabic',sans-serif; margin-top:2px;
  }

  .account-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .account-card:hover{border-color:rgba(203,145,82,0.4); background:var(--surface-2);}
  .account-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .account-name{ font-weight:700; font-size:15px; }
  .account-total{ font-weight:800; font-size:19px; font-family:'Tajawal',sans-serif; }
  .account-breakdown{ display:flex; gap:14px; font-size:12px; color:var(--ink-dim); }
  .account-breakdown b{ color:var(--ink); font-weight:600; }
  .account-note{ font-size:12.5px; color:var(--ink-dim); line-height:1.8; padding:14px 20px 0; }

  .fab{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    max-width:480px; width:calc(100% - 40px);
  }
  .fab .btn{width:100%; padding:14px; font-size:15px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.35);}

  .overlay{
    position:fixed; inset:0; background:rgba(6,9,10,0.65);
    display:flex; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px);
  }
  .sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:22px 20px 26px; border-top:1px solid var(--border); max-height:88vh; overflow-y:auto;
  }
  .sheet-title{font-size:17px; font-weight:800; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{ display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:6px; font-weight:600; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; color:var(--ink); font-family:inherit; font-size:14.5px;
  }
  .field input:focus, .field select:focus{outline:1px solid var(--accent);}
  .toggle-row{display:flex; gap:8px;}
  .toggle-opt{
    flex:1; text-align:center; padding:11px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); cursor:pointer; font-weight:700; font-size:14px; color:var(--ink-dim);
    transition:all .15s;
  }
  .toggle-opt.active-out{background:rgba(227,132,85,0.16); border-color:var(--debt); color:var(--debt);}
  .toggle-opt.active-in{background:rgba(116,187,142,0.16); border-color:var(--credit); color:var(--credit);}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions .btn{flex:1;}
  .sheet-text{ font-size:13.5px; color:var(--ink-dim); line-height:1.8; margin-bottom:18px; }
  .settings-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }

  .detail-header{
    padding:18px 20px 20px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back-btn{
    background:none; border:none; color:var(--ink-dim); font-size:14px; cursor:pointer;
    display:flex; align-items:center; gap:5px; font-family:inherit; padding:4px 0;
  }
  .back-btn:hover{color:var(--ink);}
  .detail-name{font-size:21px; font-weight:800; margin-bottom:8px;}
  .detail-chips{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .detail-balance-row{display:flex; align-items:flex-end; justify-content:space-between;}
  .detail-links{display:flex; gap:14px;}
  .link-btn{
    background:none;border:none;color:var(--ink-dim);font-size:12.5px;cursor:pointer;
    text-decoration:underline; font-family:inherit; padding:0;
  }
  .link-btn:hover{color:var(--ink);}
  .link-btn.danger:hover{color:var(--danger);}

  .tx-form{
    padding:16px 20px; border-bottom:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; gap:12px;
  }
  .tx-form-title{font-size:13px; font-weight:700; color:var(--ink-dim); margin-bottom:-2px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1; margin-bottom:0;}

  .tx-list{padding:16px 20px 100px; display:flex; flex-direction:column; gap:8px;}
  .section-label{font-size:12.5px; font-weight:700; color:var(--ink-dim); margin-bottom:4px; margin-top:6px;}
  .tx-item{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
    transition:border-color .15s;
  }
  .tx-item:hover{ border-color:rgba(203,145,82,0.4); }
  .tx-left{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .tx-desc{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-meta{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-dim); flex-wrap:wrap;}
  .tx-right{text-align:left; white-space:nowrap;}
  .tx-amount{font-weight:800; font-size:15px; font-family:'Tajawal',sans-serif;}
  .tx-amount.out{color:var(--debt);}
  .tx-amount.in{color:var(--credit);}
  .tx-running{font-size:10.5px; color:var(--ink-dim); margin-top:2px;}

  .confirm-sheet{ text-align:center; }
  .confirm-msg{ font-size:14.5px; line-height:1.8; margin-bottom:20px; }

  .loading{ display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--ink-dim); font-size:14px; }

  /* آلة حاسبة */
  .calc-display{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:22px 16px; text-align:left; font-family:'Tajawal',sans-serif; font-size:36px;
    font-weight:800; margin-bottom:14px; overflow-x:auto; white-space:nowrap; direction:ltr;
  }
  .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .calc-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:10px; padding:16px 0; font-size:18px; font-weight:700; cursor:pointer;
    font-family:'Tajawal',sans-serif; transition:opacity .1s, transform .1s;
  }
  .calc-btn:active{ transform:scale(0.95); }
  .calc-btn.op{ background:rgba(203,145,82,0.16); color:var(--accent); }
  .calc-btn.eq{ background:var(--accent); color:var(--accent-ink); }
  .calc-btn.fn{ background:rgba(213,101,78,0.16); color:var(--danger); }

  /* شارات الكود القابلة للكشف */
  .code-chip{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap;
    cursor:pointer; border:none; font-family:inherit; transition:opacity .1s;
  }
  .code-chip:active{ opacity:0.8; }
  .code-chip.chip-mtn{background:rgba(255,204,0,0.15); color:var(--mtn);}
  .code-chip.chip-syr{background:rgba(228,3,46,0.15); color:#F0705F;}
  .chip-yalla{background:rgba(93,169,233,0.15); color:#5DA9E9;}

  /* شبكة اختيار التصنيف */
  .cat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .cat-opt{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 8px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface-2); cursor:pointer; font-weight:700; font-size:13px;
    color:var(--ink-dim); transition:all .15s;
  }
  .cat-opt .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .cat-opt.selected{ border-color:var(--accent); color:var(--ink); background:rgba(203,145,82,0.12); }

  /* كشف الحساب للتصدير */
  .statement-wrap{
    position:fixed; top:-9999px; left:-9999px; width:420px; background:#121A1E;
    font-family:'IBM Plex Sans Arabic', sans-serif; padding:26px; color:#ECE8DF; direction:rtl;
  }
  .statement-head{ text-align:center; margin-bottom:18px; border-bottom:2px solid #CB9152; padding-bottom:14px; }
  .statement-title{ font-size:18px; font-weight:800; color:#CB9152; }
  .statement-sub{ font-size:12px; color:#93A2A6; margin-top:4px; }
  .statement-cust{ font-size:20px; font-weight:800; margin:14px 0 4px; }
  .statement-bal-row{
    display:flex; justify-content:space-between; align-items:center; background:#1A2328;
    border-radius:12px; padding:16px; margin:14px 0;
  }
  .statement-bal-label{ font-size:12px; color:#93A2A6; }
  .statement-bal-value{ font-size:26px; font-weight:800; font-family:'Tajawal',sans-serif; }
  .statement-row{
    display:flex; justify-content:space-between; font-size:12.5px; padding:9px 0;
    border-bottom:1px solid rgba(236,232,223,0.08);
  }
  .statement-foot{ text-align:center; font-size:10.5px; color:#93A2A6; margin-top:16px; }

  /* القائمة الجانبية (الدرج) */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(6,9,10,0.65); z-index:69;
  }
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px;
    background:var(--surface); border-inline-end:1px solid var(--border);
    padding:24px 18px; overflow-y:auto; z-index:70; direction:rtl;
    box-shadow:8px 0 24px rgba(0,0,0,0.35);
  }
  .drawer-item{
    padding:14px 12px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer;
    color:var(--ink); margin-bottom:4px; transition:background .15s;
  }
  .drawer-item:hover{ background:var(--surface-2); }
  .drawer-item.active{ color:var(--accent); background:rgba(203,145,82,0.12); }
</style>
</head>
<body>

<div id="passGate" style="position:fixed;inset:0;background:#121A1E;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:'IBM Plex Sans Arabic',sans-serif;">
  <div style="color:#ECE8DF;font-size:16px;font-weight:700;">أدخل كلمة السر</div>
  <input id="passInput" type="password" style="background:#1A2328;border:1px solid rgba(236,232,223,0.09);border-radius:10px;padding:12px 16px;color:#ECE8DF;font-size:15px;width:220px;text-align:center;">
  <button id="passSubmit" style="background:#CB9152;color:#1A1206;border:none;border-radius:10px;padding:12px 24px;font-weight:700;font-size:14px;cursor:pointer;">دخول</button>
  <div id="passError" style="color:#D5654E;font-size:13px;display:none;">كلمة السر غلط</div>
</div>

<div id="app" class="app"><div class="loading">جارِ التحميل…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyDbROv4I15FqbQ9g3euQIuxWzUejLbTjGc",
    authDomain: "basel-3535d.firebaseapp.com",
    databaseURL: "https://basel-3535d-default-rtdb.firebaseio.com",
    projectId: "basel-3535d",
    storageBucket: "basel-3535d.firebasestorage.app",
    messagingSenderId: "800069340051",
    appId: "1:800069340051:web:25732cf869a8efc22f3666"
  };
  var dbRef = null;
  try{
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('ledger-data');
  }catch(e){ console.error('firebase init failed', e); }

  var NETWORKS = {
    mtn: {label:'MTN', chipClass:'chip-mtn', tracked:true},
    syriatel: {label:'سيريتل', chipClass:'chip-syr', tracked:true},
    fatura_mtn: {label:'فاتورة MTN', chipClass:'chip-fmtn', tracked:true},
    fatura_syriatel: {label:'فاتورة سيريتل', chipClass:'chip-fsyr', tracked:true},
    yalla_go: {label:'يلا جو', chipClass:'chip-yalla', tracked:true},
    cash_mtn: {label:'كاش MTN', chipClass:'chip-cash', tracked:false},
    cash_syriatel: {label:'كاش سيريتل', chipClass:'chip-cash', tracked:false},
    sham_cash: {label:'شام كاش', chipClass:'chip-cash', tracked:false},
    usd: {label:'دولار', chipClass:'chip-usd', tracked:false},
    none: {label:'بدون تصنيف', chipClass:'', tracked:false}
  };
  var ACCOUNT_ORDER = ['mtn','syriatel','fatura_mtn','fatura_syriatel','yalla_go'];
  var NETWORK_GROUP = ['mtn','syriatel','fatura_mtn','fatura_syriatel','yalla_go'];
  var PAYMENT_GROUP = ['cash_mtn','cash_syriatel','sham_cash','usd'];
  var DAYS = [
    {key:'sunday', label:'الأحد'},
    {key:'monday', label:'الاثنين'},
    {key:'tuesday', label:'الثلاثاء'},
    {key:'wednesday', label:'الأربعاء'},
    {key:'thursday', label:'الخميس'},
    {key:'friday', label:'الجمعة'},
    {key:'saturday', label:'السبت'}
  ];
  var DAY_KEYS = DAYS.map(function(d){ return d.key; });

  var state = {
    customers: [],
    transactions: [],
    accountEntries: [],
    dayAssignments: {},
    screen: 'customers-list', // customers-list | customer-detail | accounts-list | account-detail | days-list | day-detail
    activeCustomerId: null,
    activeAccount: null,
    activeDay: null,
    daySearch: '',
    dayIncomeCustomerId: null,
    drawerOpen: false,
    search: '',
    modal: null, // add-customer | edit-customer | edit-tx | edit-entry | settings | add-day-customer
    editingCustomerId: null,
    editingTxId: null,
    editingEntryId: null,
    txType: 'out',
    txNetwork: 'none',
    txFormOpen: false,
    entryType: 'out',
    entryFormOpen: false,
    confirm: null, // {message, type, id}
    loaded: false,
    pendingSync: false,
    onlineCount: 0,
    installCount: 0,
    currencyMode: 'old', // old = ل.س (القديمة) | new = ل.س.ج (الجديدة)
    revealedChips: {},
    calc: { display: '0', prev: null, op: null, waitingNew: false },
    selectedStatementTxIds: [],
    profitRates: {},
    profitPeriod: 'all'
  };

  function ensureProfitRates(){
    NETWORK_GROUP.forEach(function(k){
      if(typeof state.profitRates[k] !== 'number') state.profitRates[k] = 0;
    });
  }

  function ensureDayAssignments(){
    DAY_KEYS.forEach(function(k){
      if(!Array.isArray(state.dayAssignments[k])) state.dayAssignments[k] = [];
    });
  }
  function computeTodayIncomeForDay(dayKey){
    var ids = state.dayAssignments[dayKey] || [];
    var d = new Date(); d.setHours(0,0,0,0);
    var startOfToday = d.getTime();
    var total = 0;
    var perCustomer = {};
    state.transactions.forEach(function(t){
      if(t.type !== 'in') return;
      if(ids.indexOf(t.customerId) === -1) return;
      if(t.createdAt < startOfToday) return;
      var amt = txTotal(t);
      total += amt;
      perCustomer[t.customerId] = (perCustomer[t.customerId]||0) + amt;
    });
    return {total:total, perCustomer:perCustomer};
  }
  ensureDayAssignments();

  // ---------- سجل التنقل الداخلي (لجعل زر الرجوع بالموبايل يرجع لصفحة سابقة بدل ما يطلع من التطبيق) ----------
  var UI_NAV_FIELDS = ['screen','activeCustomerId','activeAccount','activeDay','daySearch','drawerOpen','search',
    'editingCustomerId','editingTxId','editingEntryId','txType','txNetwork','txFormOpen','entryType','entryFormOpen'];
  var navStack = [];
  function captureUIState(){
    var snap = {};
    UI_NAV_FIELDS.forEach(function(k){ snap[k] = state[k]; });
    return snap;
  }
  function pushNavSnapshot(overrides){
    var snap = captureUIState();
    if(overrides) Object.keys(overrides).forEach(function(k){ snap[k] = overrides[k]; });
    navStack.push(snap);
    try{ history.pushState({navMarker:navStack.length}, '', location.href); }catch(e){}
  }
  function pushCurrentAsHistoryOnly(){
    try{ history.pushState({}, '', location.href); }catch(e){}
  }
  window.addEventListener('popstate', function(){
    // إذا في نافذة منبثقة أو قائمة أو تأكيد مفتوح، الرجوع بيسكرها بس وما بيغيّر الصفحة
    if(state.modal){ state.modal = null; render(); pushCurrentAsHistoryOnly(); return; }
    if(state.confirm){ state.confirm = null; render(); pushCurrentAsHistoryOnly(); return; }
    if(state.drawerOpen){ state.drawerOpen = false; render(); pushCurrentAsHistoryOnly(); return; }
    if(navStack.length){
      var prev = navStack.pop();
      Object.keys(prev).forEach(function(k){ state[k] = prev[k]; });
      render();
    }
    // إذا ما في شي بالسجل، بيترك السلوك الافتراضي (يقفل التطبيق) - هيك طبيعي بالشاشة الرئيسية
  });

  var CURRENCY_RATE = 100; // كم ل.س قديم = ل.س.ج واحد. غيّري الرقم هون لو تغيّر سعر الصرف الرسمي

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){ n = Math.round(Number(n)||0); return n.toLocaleString('en-US'); }
  function formatMoney(n){
    var abs = Math.abs(Number(n)||0);
    if(state.currencyMode === 'new'){
      return fmt(abs / CURRENCY_RATE) + ' <span class="unit">ل.س.ج</span>';
    }
    return fmt(abs) + ' <span class="unit">ل.س</span>';
  }
  function currencyToggleBtn(){
    var label = state.currencyMode === 'new' ? 'ل.س.ج ⇄' : 'ل.س ⇄';
    return '<button class="currency-toggle" id="toggleCurrency" title="تحويل بين العملة القديمة والجديدة">'+label+'</button>';
  }
  function hamburgerBtn(){
    return '<div class="icon-btn" id="openMenu" title="القائمة">☰</div>';
  }
  function txTotal(t){ return Number(t.baseAmount||0) + Number(t.markup||0); }

  var LOCAL_KEY = 'ledger-local-cache-v1';

  function saveLocalCache(){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify({
        customers: state.customers,
        transactions: state.transactions,
        accountEntries: state.accountEntries,
        dayAssignments: state.dayAssignments,
        profitRates: state.profitRates,
        pendingSync: state.pendingSync
      }));
    }catch(e){ console.error('local cache save failed', e); }
  }

  function loadLocalCache(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw){
        var data = JSON.parse(raw);
        state.customers = data.customers || [];
        state.transactions = data.transactions || [];
        state.accountEntries = data.accountEntries || [];
        state.dayAssignments = data.dayAssignments || {};
        ensureDayAssignments();
        state.profitRates = data.profitRates || {};
        ensureProfitRates();
        state.pendingSync = !!data.pendingSync;
        return true;
      }
    }catch(e){ console.error('local cache load failed', e); }
    return false;
  }

  function pushToFirebase(){
    if(!dbRef) return;
    dbRef.set({
      customers: state.customers,
      transactions: state.transactions,
      accountEntries: state.accountEntries,
      dayAssignments: state.dayAssignments,
      profitRates: state.profitRates,
      updatedAt: Date.now()
    }).then(function(){
      state.pendingSync = false;
      saveLocalCache();
      render();
    }).catch(function(e){
      console.error('firebase push failed (probably offline)', e);
      state.pendingSync = true;
      saveLocalCache();
    });
  }

  // كل حركة تسجيل بتنحفظ محلياً فوراً (تشتغل حتى بدون نت)، وبعدين
  // بتحاول تترفع عالسيرفر. إذا ما في نت، بتضل محفوظة عندك وبترفع
  // تلقائياً أول ما يرجع الاتصال.
  function persist(){
    state.pendingSync = true;
    saveLocalCache();
    pushToFirebase();
  }

  function load(){
    var hadLocal = loadLocalCache();
    state.loaded = true;
    render();

    if(!dbRef) return;

    firebase.database().ref('.info/connected').on('value', function(snap){
      var online = snap.val() === true;
      if(online && state.pendingSync){
        pushToFirebase();
      }
    });

    dbRef.on('value', function(snapshot){
      // إذا في تعديلات محلية لسا ما ترفعت، ما منستبدلها ببيانات
      // السيرفر القديمة، لحد ما ترفع تعديلاتنا أول.
      if(state.pendingSync) return;
      var data = snapshot.val();
      if(data){
        state.customers = data.customers || [];
        state.transactions = data.transactions || [];
        state.accountEntries = data.accountEntries || [];
        state.dayAssignments = data.dayAssignments || {};
        ensureDayAssignments();
        state.profitRates = data.profitRates || {};
        ensureProfitRates();
      }
      saveLocalCache();
      render();
    }, function(err){
      console.error('sync load failed', err);
      state.loaded = true; render();
    });
  }

  function syncBadge(){
    if(state.pendingSync){
      return '<span style="font-size:10.5px; color:var(--debt); border:1px solid rgba(227,132,85,0.4); background:rgba(227,132,85,0.12); padding:2px 7px; border-radius:6px; margin-inline-start:8px;">بانتظار الاتصال…</span>';
    }
    return '<span style="font-size:10.5px; color:var(--credit); border:1px solid rgba(116,187,142,0.4); background:rgba(116,187,142,0.12); padding:2px 7px; border-radius:6px; margin-inline-start:8px;">متزامن ✓</span>';
  }
  function statusLine(){
    return '<div style="font-size:11px;color:var(--ink-dim);margin-bottom:10px;">متصل الآن: '+state.onlineCount+' · مرات التثبيت: '+state.installCount+'</div>';
  }
  function customerBalance(customerId){
    var out = 0, inn = 0;
    state.transactions.forEach(function(t){
      if(t.customerId !== customerId) return;
      var total = txTotal(t);
      if(t.type === 'out') out += total; else inn += total;
    });
    return out - inn;
  }
  function totalOwed(){
    var total = 0;
    state.customers.forEach(function(c){ total += customerBalance(c.id); });
    return total;
  }
  function customerTx(customerId){
    return state.transactions.filter(function(t){ return t.customerId === customerId; })
      .sort(function(a,b){ return a.createdAt - b.createdAt; });
  }
  function accountTotals(network){
    var out=0, inn=0;
    state.transactions.forEach(function(t){
      if(t.network === network && t.type === 'out') out += Number(t.baseAmount||0);
    });
    state.accountEntries.forEach(function(e){
      if(e.network !== network) return;
      if(e.type === 'out') out += Number(e.amount||0); else inn += Number(e.amount||0);
    });
    return {out:out, inn:inn, net: out-inn};
  }
  function accountFeed(network){
    var items = [];
    state.transactions.forEach(function(t){
      if(t.network !== network) return;
      items.push({source:'customer', id:t.id, type:t.type, desc:t.description, amount:Number(t.baseAmount||0),
        baseAmount:t.baseAmount, markup:t.markup, customerId:t.customerId, createdAt:t.createdAt});
    });
    state.accountEntries.forEach(function(e){
      if(e.network !== network) return;
      items.push({source:'manual', id:e.id, type:e.type, desc:e.description, amount:e.amount,
        customerId:null, createdAt:e.createdAt});
    });
    items.sort(function(a,b){ return b.createdAt - a.createdAt; });
    return items;
  }
  function formatDateTime(ts){
    var d = new Date(ts);
    var day = d.getDate();
    var month = d.getMonth()+1;
    var hours = d.getHours();
    var minutes = d.getMinutes();
    var ampm = hours >= 12 ? 'م' : 'ص';
    var h12 = hours % 12; if(h12===0) h12=12;
    var mm = minutes<10 ? ('0'+minutes) : (''+minutes);
    return day+'/'+month+' '+h12+':'+mm+ampm;
  }
  function txNumber(id){
    var idx = state.transactions.findIndex(function(x){ return x.id === id; });
    return idx === -1 ? '' : (idx + 1);
  }
  function entryNumber(id){
    var idx = state.accountEntries.findIndex(function(x){ return x.id === id; });
    return idx === -1 ? '' : (idx + 1);
  }
  function customerNumber(id){
    var idx = state.customers.findIndex(function(x){ return x.id === id; });
    return idx === -1 ? '' : (idx + 1);
  }
  function customerName(id){
    var c = state.customers.find(function(x){ return x.id===id; });
    return c ? c.name : 'زبون محذوف';
  }
  function getCodes(c, type){
    var arr = (type==='mtn' ? c.mtnCodes : c.syriatelCodes) || [];
    var legacy = type==='mtn' ? c.mtnCode : c.syriatelCode;
    var result = arr.slice();
    if(legacy && result.indexOf(legacy) === -1) result.unshift(legacy);
    return result.filter(Boolean);
  }
  function codeChipHtml(c, type){
    var codes = getCodes(c, type);
    if(codes.length === 0) return '';
    var label = type==='mtn' ? 'MTN' : 'سيريتل';
    var cls = type==='mtn' ? 'chip-mtn' : 'chip-syr';
    var key = c.id+'-'+type;
    var revealed = !!state.revealedChips[key];
    var text = revealed ? codes.join('، ') : (label + (codes.length>1 ? ' ('+codes.length+')' : ''));
    return '<button type="button" class="code-chip '+cls+'" data-reveal-chip="'+key+'">'+escapeHtml(text)+'</button>';
  }
  function chip(network){
    var n = NETWORKS[network] || NETWORKS.none;
    if(network==='none' || !network) return '';
    return '<span class="chip '+n.chipClass+'">'+n.label+'</span>';
  }
  var NETWORK_COLOR = {
    mtn:'#FFCC00', syriatel:'#E4032E', fatura_mtn:'#FFCC00', fatura_syriatel:'#E4032E', yalla_go:'#5DA9E9',
    cash_mtn:'#CB9152', cash_syriatel:'#CB9152', sham_cash:'#CB9152', usd:'#74BB8E', none:'#93A2A6'
  };
  function categoryGridHtml(selected, dataAttr){
    var html = '<div class="cat-grid">';
    html += '<div class="cat-opt'+(selected==='none'?' selected':'')+'" data-'+dataAttr+'="none"><span class="dot" style="background:'+NETWORK_COLOR.none+';"></span>بدون تصنيف</div>';
    NETWORK_GROUP.concat(PAYMENT_GROUP).forEach(function(k){
      html += '<div class="cat-opt'+(selected===k?' selected':'')+'" data-'+dataAttr+'="'+k+'"><span class="dot" style="background:'+NETWORK_COLOR[k]+';"></span>'+NETWORKS[k].label+'</div>';
    });
    html += '</div>';
    return html;
  }
  function networkSelectOptions(selected){
    var html = '<option value="none"'+(selected==='none'?' selected':'')+'>بدون تصنيف</option>';
    html += '<optgroup label="شبكات">';
    NETWORK_GROUP.forEach(function(k){
      html += '<option value="'+k+'"'+(selected===k?' selected':'')+'>'+NETWORKS[k].label+'</option>';
    });
    html += '</optgroup><optgroup label="طرق الدفع">';
    PAYMENT_GROUP.forEach(function(k){
      html += '<option value="'+k+'"'+(selected===k?' selected':'')+'>'+NETWORKS[k].label+'</option>';
    });
    html += '</optgroup>';
    return html;
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- render ----------
  function render(){
    var app = document.getElementById('app');
    if(!state.loaded){ app.innerHTML = '<div class="loading">جارِ التحميل…</div>'; return; }

    var html = '';
    if(state.screen === 'customer-detail') html = renderCustomerDetail();
    else if(state.screen === 'accounts-list') html = renderAccountsList();
    else if(state.screen === 'account-detail') html = renderAccountDetail();
    else if(state.screen === 'days-list') html = renderDaysList();
    else if(state.screen === 'day-detail') html = renderDayDetail();
    else if(state.screen === 'profit-report') html = renderProfitReport();
    else html = renderCustomersList();

    app.innerHTML = html;

    if(state.modal === 'add-customer' || state.modal === 'edit-customer'){
      app.insertAdjacentHTML('beforeend', renderCustomerSheet());
    }
    if(state.modal === 'edit-tx'){
      app.insertAdjacentHTML('beforeend', renderTxSheet());
    }
    if(state.modal === 'edit-entry'){
      app.insertAdjacentHTML('beforeend', renderEntrySheet());
    }
    if(state.modal === 'export-statement'){
      app.insertAdjacentHTML('beforeend', renderExportChoiceSheet());
    }
    if(state.modal === 'select-statement-tx'){
      app.insertAdjacentHTML('beforeend', renderSelectStatementSheet());
    }
    if(state.modal === 'customer-menu'){
      app.insertAdjacentHTML('beforeend', renderCustomerMenuSheet());
    }
    if(state.modal === 'calculator'){
      app.insertAdjacentHTML('beforeend', renderCalculatorSheet());
    }
    if(state.modal === 'settings'){
      app.insertAdjacentHTML('beforeend', renderSettingsSheet());
    }
    if(state.modal === 'add-day-customer'){
      app.insertAdjacentHTML('beforeend', renderAddDayCustomerSheet());
    }
    if(state.modal === 'day-quick-income'){
      app.insertAdjacentHTML('beforeend', renderDayIncomeSheet());
    }
    if(state.modal === 'profit-rates'){
      app.insertAdjacentHTML('beforeend', renderProfitRatesSheet());
    }
    if(state.confirm){
      app.insertAdjacentHTML('beforeend', renderConfirmSheet());
    }
    if(state.drawerOpen){
      app.insertAdjacentHTML('beforeend', renderDrawer());
    }
    bindEvents();
  }

  function renderTabs(){
    var html = '<div class="tabs">';
    html += '  <div class="tab '+(state.screen==='customers-list'?'active':'')+'" data-tab="customers">الزباين</div>';
    html += '  <div class="tab '+(state.screen==='accounts-list'?'active':'')+'" data-tab="accounts">الحسابات الفرعية</div>';
    html += '</div>';
    return html;
  }

  function renderCustomersList(){
    var q = state.search.trim().toLowerCase();
    var list = state.customers.filter(function(c){
      if(!q) return true;
      return c.name.toLowerCase().includes(q) || getCodes(c,'mtn').some(function(x){return x.includes(q);}) || getCodes(c,'syr').some(function(x){return x.includes(q);});
    }).sort(function(a,b){ return state.customers.indexOf(b) - state.customers.indexOf(a); });

    var html = '';
    html += '<div class="header">';
    html += '  <div class="header-top"><div class="brand">Abu Basel Al Shahm'+syncBadge()+'</div><div style="display:flex;gap:8px;align-items:center;">'+currencyToggleBtn()+'<div class="icon-btn" id="openCalc" title="آلة حاسبة">🧮</div><div class="icon-btn" id="openSettings" title="نسخة احتياطية">⚙</div>'+hamburgerBtn()+'</div></div>';
    html += statusLine();
    html += renderTabs();
    html += '</div>';
    html += '<div class="toolbar"><input class="search" id="searchInput" placeholder="بحث بالاسم أو الكود…" value="'+escapeHtml(state.search)+'"></div>';

    if(list.length === 0){
      html += '<div class="list"><div class="empty">'+
        (state.customers.length === 0 ? 'ما في زباين لسا.<br>اضغط "إضافة زبون" تحت لتبدأ.' : 'ما في نتائج للبحث.')+
        '</div></div>';
    } else {
      html += '<div class="list">';
      list.forEach(function(c){
        var bal = customerBalance(c.id);
        var balClass = bal > 0 ? 'owed' : (bal < 0 ? 'clear' : '');
        var subLabel = bal > 0 ? 'مستحق' : (bal < 0 ? 'رصيد لصالحه' : 'مسدد');
        html += '<div class="customer-card" data-open="'+c.id+'">';
        html += '  <div class="customer-info"><div class="customer-name">#'+customerNumber(c.id)+' — '+escapeHtml(c.name)+'</div><div class="chips">';
        html += codeChipHtml(c, 'mtn');
        html += codeChipHtml(c, 'syr');
        html += '  </div></div>';
        html += '  <div class="customer-balance '+balClass+'">'+formatMoney(bal)+'<span class="sub">'+subLabel+'</span></div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '<div class="fab"><button class="btn btn-accent" id="openAddCustomer">+ إضافة زبون</button></div>';
    return html;
  }

  function renderAccountsList(){
    var html = '';
    html += '<div class="header">';
    html += '  <div class="header-top"><div class="brand">Abu Basel Al Shahm'+syncBadge()+'</div><div style="display:flex;gap:8px;align-items:center;">'+currencyToggleBtn()+'<div class="icon-btn" id="openSettings" title="نسخة احتياطية">⚙</div>'+hamburgerBtn()+'</div></div>';
    html += statusLine();
    html += renderTabs();
    html += '</div>';
    html += '<div class="list" style="padding-top:16px;">';
    ACCOUNT_ORDER.forEach(function(net){
      var n = NETWORKS[net];
      var totals = accountTotals(net);
      var netClass = totals.net > 0 ? 'owed' : (totals.net < 0 ? 'clear' : '');
      html += '<div class="account-card" data-open-account="'+net+'">';
      html += '  <div class="account-card-top"><div class="account-name">'+n.label+'</div><div class="account-total '+netClass+'">'+formatMoney(totals.net)+'</div></div>';
      html += '  <div class="account-breakdown"><span>منصرف: <b>'+fmt(totals.out)+'</b></span><span>وارد: <b>'+fmt(totals.inn)+'</b></span></div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderAccountDetail(){
    var net = state.activeAccount;
    var n = NETWORKS[net] || NETWORKS.none;
    var totals = accountTotals(net);
    var netClass = totals.net > 0 ? 'owed' : (totals.net < 0 ? 'clear' : '');
    var feed = accountFeed(net);

    var html = '';
    html += '<div class="detail-header">';
    html += '  <div class="back-row"><button class="back-btn" id="backToAccounts">→ الحسابات الفرعية</button></div>';
    html += '  <div class="detail-name">'+n.label+'</div>';
    html += '  <div class="stat-label">صافي الحركة</div>';
    html += '  <div class="stat-value '+netClass+'" style="font-size:26px;">'+formatMoney(totals.net)+' '+currencyToggleBtn()+'</div>';
    html += '  <div class="account-breakdown" style="margin-top:10px;"><span>منصرف: <b>'+fmt(totals.out)+'</b></span><span>وارد: <b>'+fmt(totals.inn)+'</b></span></div>';
    html += '</div>';

    html += '<div class="tx-form">';
    html += '  <div class="tx-form-title" style="display:flex;justify-content:space-between;align-items:center;"><span>إضافة حركة يدوية</span>'+(state.entryFormOpen?'<button class="link-btn" id="closeEntryForm" style="font-size:17px;">✕</button>':'')+'</div>';
    html += '  <div class="toggle-row">';
    html += '    <div class="toggle-opt '+(state.entryFormOpen && state.entryType==='out'?'active-out':'')+'" data-entry-type="out">منصرف</div>';
    html += '    <div class="toggle-opt '+(state.entryFormOpen && state.entryType==='in'?'active-in':'')+'" data-entry-type="in">وارد</div>';
    html += '  </div>';
    if(state.entryFormOpen){
      html += '  <div class="field"><label>الوصف</label><input id="entryDesc" placeholder="وصف العملية"></div>';
      html += '  <div class="field"><label>المبلغ (ل.س)</label><input id="entryAmount" type="number" inputmode="numeric" placeholder="0"></div>';
      html += '  <button class="btn btn-accent" id="addEntryBtn">حفظ الحركة</button>';
    }
    html += '</div>';

    html += '<div class="tx-list">';
    if(feed.length===0){
      html += '<div class="empty">ما في حركات مسجلة بهاد الحساب بعد.</div>';
    } else {
      html += '<div class="section-label">كل الحركات</div>';
      feed.forEach(function(item){
        var dateStr = formatDateTime(item.createdAt);
        var attr = item.source==='customer' ? 'data-goto-customer="'+item.customerId+'"' : 'data-edit-entry="'+item.id+'"';
        var opNum = item.source==='customer' ? txNumber(item.id) : entryNumber(item.id);
        var titleText = item.source==='customer' ? escapeHtml(customerName(item.customerId))+(item.desc?' · '+escapeHtml(item.desc):'') : (item.desc ? escapeHtml(item.desc) : (item.type==='out'?'منصرف':'وارد'));
        html += '<div class="tx-item" '+attr+'>';
        html += '  <div class="tx-left"><div class="tx-desc">#'+opNum+' — '+titleText+'</div>';
        html += '  <div class="tx-meta"><span>'+(item.type==='out'?'منصرف':'وارد')+'</span>';
        if(item.source==='manual') html += '<span class="chip chip-manual" style="padding:2px 6px;">قيد يدوي</span>';
        html += '<span>· '+dateStr+'</span></div></div>';
        html += '  <div class="tx-right"><div class="tx-amount '+item.type+'">'+(item.type==='out'?'+':'−')+fmt(item.amount)+'</div></div>';
        html += '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderDaysList(){
    var html = '';
    html += '<div class="header">';
    html += '  <div class="header-top"><div class="brand">أيام اللمة</div>'+hamburgerBtn()+'</div>';
    html += '</div>';
    html += '<div class="list" style="padding-top:16px;">';
    DAYS.forEach(function(d){
      var count = (state.dayAssignments[d.key]||[]).length;
      html += '<div class="account-card" data-open-day="'+d.key+'">';
      html += '  <div class="account-card-top"><div class="account-name">'+d.label+'</div><div style="font-size:13px;color:var(--ink-dim);font-weight:700;">'+count+' زبون</div></div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderDayDetail(){
    var day = DAYS.find(function(d){ return d.key === state.activeDay; }) || {label:''};
    var ids = state.dayAssignments[state.activeDay] || [];
    var incomeReport = computeTodayIncomeForDay(state.activeDay);
    var html = '';
    html += '<div class="detail-header">';

  function calcOp(a, b, op){
    switch(op){
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? 0 : a / b;
      default: return b;
    }
  }
  function calcPress(key){
    var c = state.calc;
    if(key === 'clear'){ c.display='0'; c.prev=null; c.op=null; c.waitingNew=false; return; }
    if(key === 'sign'){ c.display = String(Number(c.display) * -1); return; }
    if(key === 'percent'){ c.display = String(Number(c.display) / 100); return; }
    if(key === 'dot'){
      if(c.waitingNew){ c.display='0.'; c.waitingNew=false; return; }
      if(c.display.indexOf('.') === -1) c.display += '.';
      return;
    }
    if(/^[0-9]$/.test(key)){
      if(c.waitingNew || c.display === '0'){ c.display = key; c.waitingNew = false; }
      else { c.display += key; }
      return;
    }
    if(['add','subtract','multiply','divide'].indexOf(key) !== -1){
      if(c.op && !c.waitingNew){
        c.prev = calcOp(c.prev, Number(c.display), c.op);
        c.display = String(Math.round(c.prev * 1e8) / 1e8);
      } else {
        c.prev = Number(c.display);
      }
      c.op = key;
      c.waitingNew = true;
      return;
    }
    if(key === 'equals'){
      if(c.op == null) return;
      var result = calcOp(c.prev, Number(c.display), c.op);
      c.display = String(Math.round(result * 1e8) / 1e8);
      c.prev = null; c.op = null; c.waitingNew = true;
      return;
    }
  }

  function computeProfitReport(){
    var now = Date.now();
    var cutoff = null;
    if(state.profitPeriod === 'today') cutoff = now - 24*60*60*1000;
    else if(state.profitPeriod === 'week') cutoff = now - 7*24*60*60*1000;
    else if(state.profitPeriod === 'month') cutoff = now - 30*24*60*60*1000;
    var byNetwork = {};
    var total = 0;
    state.transactions.forEach(function(t){
      if(t.type !== 'out') return;
      if(cutoff !== null && t.createdAt < cutoff) return;
      var net = t.network || 'none';
      var costRate = Number(state.profitRates[net] || 0);
      var profit = Number(t.markup||0) - Number(t.baseAmount||0) * (costRate/100);
      if(profit === 0) return;
      total += profit;
      byNetwork[net] = (byNetwork[net]||0) + profit;
    });
    return {total:total, byNetwork:byNetwork};
  }

  function buildStatementNode(c){
    var selectedTxs = customerTx(c.id).filter(function(t){ return state.selectedStatementTxIds.indexOf(t.id) !== -1; });
    var bal = 0;
    selectedTxs.forEach(function(t){
      var total = txTotal(t);
      bal += (t.type === 'out' ? total : -total);
    });
    var txs = selectedTxs.slice().reverse();
    var wrap = document.createElement('div');
    wrap.className = 'statement-wrap';
    var html = '';
    html += '<div class="statement-head"><div class="statement-title">Abu Basel Al Shahm</div><div class="statement-sub">كشف حساب زبون</div></div>';
    html += '<div class="statement-cust">'+escapeHtml(c.name)+'</div>';
    var codesLine = [];
    getCodes(c,'mtn').forEach(function(x){ codesLine.push('MTN: '+x); });
    getCodes(c,'syr').forEach(function(x){ codesLine.push('سيريتل: '+x); });
    if(codesLine.length) html += '<div class="statement-sub">'+escapeHtml(codesLine.join(' · '))+'</div>';
    html += '<div class="statement-bal-row"><div><div class="statement-bal-label">'+(bal>0?'إجمالي المستحق (العمليات المختارة)':(bal<0?'إجمالي لصالح الزبون (العمليات المختارة)':'صفر (العمليات المختارة)'))+'</div></div>';
    html += '<div class="statement-bal-value" style="color:'+(bal>0?'#E38455':(bal<0?'#74BB8E':'#ECE8DF'))+';">'+fmt(Math.abs(bal))+' ل.س</div></div>';
    if(txs.length){
      html += '<div style="font-size:12px;color:#93A2A6;margin-bottom:4px;">آخر الحركات</div>';
      txs.forEach(function(t){
        var total = txTotal(t);
        html += '<div class="statement-row"><span>'+escapeHtml(t.description||(t.type==='out'?'منصرف':'وارد'))+' · '+formatDateTime(t.createdAt)+'</span><span style="color:'+(t.type==='out'?'#E38455':'#74BB8E')+';font-weight:700;">'+(t.type==='out'?'+':'−')+fmt(total)+'</span></div>';
      });
    }
    html += '<div class="statement-foot">تاريخ الإصدار: '+formatDateTime(Date.now())+'</div>';
    wrap.innerHTML = html;
    document.body.appendChild(wrap);
    return wrap;
  }

  function exportStatementAs(type){
    var c = state.customers.find(function(x){ return x.id === state.activeCustomerId; });
    if(!c) return;
    var node = buildStatementNode(c);
    html2canvas(node, {backgroundColor:'#121A1E', scale:2}).then(function(canvas){
      document.body.removeChild(node);
      var safeName = c.name.replace(/[^\u0600-\u06FFa-zA-Z0-9]+/g,'-');
      if(type === 'image'){
        canvas.toBlob(function(blob){
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = 'كشف-حساب-'+safeName+'.png';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        });
      } else {
        var imgData = canvas.toDataURL('image/png');
        var jsPDFCtor = window.jspdf ? window.jspdf.jsPDF : null;
        if(!jsPDFCtor){ alert('تعذّر تحميل أداة PDF، جرب تصدير الصورة بدلها.'); return; }
        var pdf = new jsPDFCtor({ unit:'px', format:[canvas.width, canvas.height] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('كشف-حساب-'+safeName+'.pdf');
      }
      state.modal = null; render();
    }).catch(function(e){
      console.error('export failed', e);
      if(document.body.contains(node)) document.body.removeChild(node);
      alert('صار خطأ بالتصدير، جرب مرة تانية.');
    });
  }

    document.body.appendChild(a);

  }

    var deleteTxBtn = document.getElementById('deleteTxBtn');
    if(deleteTxBtn) deleteTxBtn.addEventListener('click', function(){
      state.confirm = {message:'متأكد إنك بدك تحذف هاي الحركة؟ ما في رجعة عن هالخطوة.', type:'delete-tx', id: state.editingTxId};
      render();
    });

    document.querySelectorAll('[data-entry-type]').forEach(function(el){
      el.addEventListener('click', function(){ state.entryType = el.getAttribute('data-entry-type'); state.entryFormOpen = true; render(); });
    });
    var addEntryBtn = document.getElementById('addEntryBtn');
    if(addEntryBtn) addEntryBtn.addEventListener('click', function(){
      var descEl = document.getElementById('entryDesc');
      var amtEl = document.getElementById('entryAmount');
      var desc = descEl.value.trim();
      var amt = Number(amtEl.value);
      if(!amt || amt <= 0){ amtEl.focus(); return; }
      state.accountEntries.push({
        id: uid(), network: state.activeAccount, type: state.entryType, description: desc, amount: amt, createdAt: Date.now()
      });
      state.entryFormOpen = false;
      persist(); render();
    });

    document.querySelectorAll('[data-edit-entry]').forEach(function(el){
      el.addEventListener('click', function(){
        var e = state.accountEntries.find(function(x){ return x.id === el.getAttribute('data-edit-entry'); });
        if(!e) return;
        state.editingEntryId = e.id; state.entryType = e.type;
        state.modal = 'edit-entry'; render();
      });
    });
    document.querySelectorAll('[data-edit-entry-type]').forEach(function(el){
      el.addEventListener('click', function(){ state.entryType = el.getAttribute('data-edit-entry-type'); render(); });
    });
    var saveEntryBtn = document.getElementById('saveEntryBtn');
    if(saveEntryBtn) saveEntryBtn.addEventListener('click', function(){
      var e = state.accountEntries.find(function(x){ return x.id === state.editingEntryId; });
      if(!e) return;
      var descEl = document.getElementById('editEntryDesc');
      var amtEl = document.getElementById('editEntryAmount');
      var amt = Number(amtEl.value);
      if(!amt || amt <= 0){ amtEl.focus(); return; }
      e.description = descEl.value.trim();
      e.amount = amt;
      e.type = state.entryType;
      state.modal = null; state.editingEntryId = null;
      persist(); render();
    });
    var deleteEntryBtn = document.getElementById('deleteEntryBtn');
    if(deleteEntryBtn) deleteEntryBtn.addEventListener('click', function(){
      state.confirm = {message:'متأكد إنك بدك تحذف هاي الحركة اليدوية؟ ما في رجعة عن هالخطوة.', type:'delete-entry', id: state.editingEntryId};
      render();
    });

    var overlay = document.getElementById('overlay');
    if(overlay) overlay.addEventListener('click', function(e){
      if(e.target === overlay){ state.modal=null; state.editingCustomerId=null; state.editingTxId=null; state.editingEntryId=null; render(); }
    });
    var cancelCustSheet = document.getElementById('cancelCustSheet');
    if(cancelCustSheet) cancelCustSheet.addEventListener('click', function(){ state.modal=null; state.editingCustomerId=null; render(); });
    var closeSettings = document.getElementById('closeSettings');
    if(closeSettings) closeSettings.addEventListener('click', function(){ state.modal=null; render(); });

    var logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.addEventListener('click', function(){
      localStorage.removeItem(REMEMBER_KEY);
      firebase.auth().signOut();
    });

    var saveCustomer = document.getElementById('saveCustomer');
    if(saveCustomer) saveCustomer.addEventListener('click', function(){
      var nameEl = document.getElementById('custName');
      var name = nameEl.value.trim();
      if(!name){ nameEl.focus(); return; }
      var mtnCodes = [document.getElementById('custMtn1').value.trim(), document.getElementById('custMtn2').value.trim()].filter(Boolean);
      var syrCodes = [document.getElementById('custSyr1').value.trim(), document.getElementById('custSyr2').value.trim()].filter(Boolean);
      if(state.modal === 'edit-customer'){
        var c = state.customers.find(function(x){ return x.id === state.editingCustomerId; });
        if(c){ c.name=name; c.mtnCodes=mtnCodes; c.syriatelCodes=syrCodes; c.mtnCode=''; c.syriatelCode=''; }
      } else {
        state.customers.push({ id: uid(), name:name, mtnCodes:mtnCodes, syriatelCodes:syrCodes, createdAt: Date.now() });
      }
      state.modal = null; state.editingCustomerId = null;
      persist(); render();
    });

    var exportBtn = document.getElementById('exportBackup');
    if(exportBtn) exportBtn.addEventListener('click', exportBackup);

    var importBtn = document.getElementById('importBackupBtn');
    var importInput = document.getElementById('importFileInput');
    if(importBtn && importInput){
      importBtn.addEventListener('click', function(){ importInput.click(); });
      importInput.addEventListener('change', function(e){
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          try{
            var data = JSON.parse(ev.target.result);
            if(!data || !Array.isArray(data.customers) || !Array.isArray(data.transactions)){
              alert('ملف النسخة الاحتياطية مش صحيح.');
              return;
            }
            data.accountEntries = data.accountEntries || [];
            data.dayAssignments = data.dayAssignments || {};
            data.profitRates = data.profitRates || {};
            state.confirm = {message:'استيراد هالنسخة رح يستبدل كل البيانات الحالية. متابعة؟', type:'import-backup', payload:data};
            render();
          }catch(err){ alert('تعذّر قراءة الملف. تأكد إنو ملف JSON صحيح.'); }
        };
        reader.readAsText(file);
      });
    }

    var confirmYes = document.getElementById('confirmYes');
    if(confirmYes) confirmYes.addEventListener('click', function(){
      var conf = state.confirm;
      if(conf.type === 'delete-customer'){
        state.customers = state.customers.filter(function(x){ return x.id !== conf.id; });
        state.transactions = state.transactions.filter(function(t){ return t.customerId !== conf.id; });
        DAY_KEYS.forEach(function(k){
          state.dayAssignments[k] = (state.dayAssignments[k]||[]).filter(function(cid){ return cid !== conf.id; });
        });
        state.screen = 'customers-list'; state.activeCustomerId = null;
        persist();
      } else if(conf.type === 'delete-tx'){
        state.transactions = state.transactions.filter(function(t){ return t.id !== conf.id; });
        state.modal = null; state.editingTxId = null;
        persist();
      } else if(conf.type === 'delete-entry'){
        state.accountEntries = state.accountEntries.filter(function(e){ return e.id !== conf.id; });
        state.modal = null; state.editingEntryId = null;
        persist();
      } else if(conf.type === 'import-backup'){
        state.customers = conf.payload.customers;
        state.transactions = conf.payload.transactions;
        state.accountEntries = conf.payload.accountEntries || [];
        state.dayAssignments = conf.payload.dayAssignments || {};
        ensureDayAssignments();
        state.profitRates = conf.payload.profitRates || {};
        ensureProfitRates();
        state.modal = null;
        persist();
      }
      state.confirm = null;
      render();
    });
    var confirmNo = document.getElementById('confirmNo');
    if(confirmNo) confirmNo.addEventListener('click', function(){ state.confirm = null; render(); });
  }

  // ---------- المصادقة (كلمة سر حقيقية عبر Firebase Auth + تذكّر لمدة 24 ساعة) ----------
  // *** غيّري هاد الإيميل ليطابق بالضبط الإيميل يلي عملتيه بـ Firebase Console > Authentication > Users ***
  var APP_LOGIN_EMAIL = "Abubaselalshahm@gmail.com";
  var REMEMBER_KEY = 'auth-remember-until';
  var REMEMBER_MS = 24 * 60 * 60 * 1000; // 24 ساعة. غيّري الرقم إذا بدك مدة تانية (مثلاً 7 * 24 * 60 * 60 * 1000 لأسبوع)

  var passSubmitBtn = document.getElementById('passSubmit');
  var passInputEl = document.getElementById('passInput');
  if(passSubmitBtn) passSubmitBtn.addEventListener('click', tryLogin);
  if(passInputEl) passInputEl.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

  function tryLogin(){
    var val = document.getElementById('passInput').value;
    document.getElementById('passError').style.display = 'none';
    firebase.auth().signInWithEmailAndPassword(APP_LOGIN_EMAIL, val).then(function(){
      localStorage.setItem(REMEMBER_KEY, String(Date.now() + REMEMBER_MS));
    }).catch(function(e){
      console.error(e);
      document.getElementById('passError').textContent = 'كلمة السر غلط';
      document.getElementById('passError').style.display = 'block';
    });
  }

  firebase.auth().onAuthStateChanged(function(user){
    if(user){
      var until = Number(localStorage.getItem(REMEMBER_KEY) || 0);
      if(Date.now() > until){
        // انتهت مدة الـ 24 ساعة، لازم كلمة السر من جديد
        firebase.auth().signOut();
        return;
      }
      document.getElementById('passGate').style.display = 'none';
      if(!state.loaded){
        try{ history.replaceState({navMarker:0}, '', location.href); }catch(e){}
        load();
        trackPresence();
        trackInstalls();
      }
    } else {
      document.getElementById('passGate').style.display = 'flex';
    }
  });

  function trackPresence(){
    var uidVal = firebase.auth().currentUser.uid;
    var presenceRef = firebase.database().ref('presence/' + uidVal);
    firebase.database().ref('.info/connected').on('value', function(snap){
      if(snap.val() === true){
        presenceRef.onDisconnect().remove();
        presenceRef.set(true);
      }
    });
    firebase.database().ref('presence').on('value', function(snap){
      state.onlineCount = snap.numChildren();
      render();
    });
  }

  function trackInstalls(){
    firebase.database().ref('installs').on('value', function(snap){
      state.installCount = snap.numChildren();
      render();
    });
    window.addEventListener('appinstalled', function(){
      firebase.database().ref('installs').push(true);
    });
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.error('sw register failed', e); });
    });
  }
})();
</script>
</body>
</html>
